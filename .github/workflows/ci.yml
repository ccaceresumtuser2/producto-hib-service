name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Solo una ejecución a la vez: todas comparten la misma base de datos de Render
concurrency:
  group: ci-render-db
  cancel-in-progress: false

jobs:
  test:
    name: Pruebas (PostgreSQL en Render)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Spring Boot toma estas variables y reemplaza los valores de application.yml.
      # Usar el hostname EXTERNO de Render (...oregon-postgres.render.com); Render exige SSL desde fuera.
      SPRING_DATASOURCE_URL: ${{ secrets.DB_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar que existan los secrets
        run: |
          for v in SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secret para $v"; exit 1; fi
          done

      - name: Ejecutar pruebas (dominio, casos de uso, arquitectura, web y persistencia)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: target/surefire-reports/
          retention-days: 7
