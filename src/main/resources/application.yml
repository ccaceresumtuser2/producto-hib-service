server:
  port: 8092

spring:
  application:
    name: producto-service-hib

  datasource:
    url: jdbc:postgresql://localhost:5432/topicos_db
    username: postgres
    password: bdatos

  jpa:
    open-in-view: false
    hibernate:
      # Flyway es el dueño del esquema; Hibernate solo verifica que la entidad coincida con la tabla
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      # Reinicia la app al recompilar clases; los cambios en static/templates no reinician
      enabled: true
      exclude: static/**,templates/**
    livereload:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # La tabla productos ya existía en topicos_db antes de usar Flyway.
    # Con baseline en la versión 1, Flyway marca V1 como aplicada y no intenta recrearla.
    # En una base de datos vacía, V1 se ejecuta normalmente.
    baseline-on-migrate: true
    baseline-version: 1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
